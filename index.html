<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export to KMZ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; background: #fff; color: #333; }
  .header { background: #1a3a2a; color: #fff; padding: 10px 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
  .body { padding: 12px 14px; }
  .bar { font-size: 11px; padding: 5px 8px; border-radius: 3px; margin-bottom: 10px; }
  .bar-ok  { background:#eafaf1; color:#1e8449; border:1px solid #a9dfbf; }
  .bar-warn{ background:#fff8e1; color:#b7770d; border:1px solid #ffe082; }
  .bar-err { background:#fdecea; color:#922b21; border:1px solid #f5c6cb; }
  .bar-info{ background:#f0f4ff; color:#2471a3; border:1px solid #c3d3f7; }
  label.lbl { display:block; font-weight:600; margin-bottom:3px; color:#444; font-size:12px; }
  input[type=text], input[type=password], textarea {
    width:100%; padding:6px 8px; border:1px solid #ccc; border-radius:3px;
    font-size:12px; margin-bottom:8px; color:#222; font-family:inherit;
  }
  textarea { resize:vertical; font-family:monospace; font-size:11px; }
  .btn { width:100%; padding:7px; margin-bottom:10px; border:1px solid #bdd4f0; border-radius:3px; cursor:pointer; font-size:12px; font-weight:600; }
  .btn-blue  { background:#eaf3ff; color:#1a4f8a; border-color:#bdd4f0; }
  .btn-green { background:#1a3a2a; color:#fff; border:none; border-radius:4px; font-size:13px; padding:10px; font-weight:700; letter-spacing:0.4px; }
  .btn-green.done  { background:#1e8449; }
  .btn-green.err   { background:#c0392b; }
  .btn:disabled, .btn-green:disabled { opacity:0.5; cursor:not-allowed; }
  .btn:hover:not(:disabled) { filter:brightness(0.95); }
  .field-list { border:1px solid #ccc; border-radius:3px; max-height:140px; overflow-y:auto; margin-bottom:10px; background:#fafafa; }
  .fl-head { display:flex; gap:6px; padding:4px 8px; border-bottom:1px solid #eee; background:#f0f0f0; position:sticky; top:0; }
  .fl-head button { font-size:11px; padding:2px 8px; cursor:pointer; background:#fff; border:1px solid #ccc; border-radius:3px; }
  .fi { display:flex; align-items:center; gap:7px; padding:4px 10px; border-bottom:1px solid #f0f0f0; cursor:pointer; }
  .fi:hover { background:#f5f5f5; }
  .fi.on { background:#eaf3ff; }
  .fi span { font-size:12px; color:#333; }
  .filter-box { padding:5px 8px; margin-bottom:6px; background:#f5f5f5; border:1px solid #ddd; border-radius:3px; font-size:11px; font-family:monospace; color:#1a3a2a; word-break:break-all; max-height:50px; overflow-y:auto; min-height:24px; }
  .note { font-size:11px; color:#888; padding:5px 8px; background:#f9f9f9; border:1px solid #eee; border-radius:3px; margin-bottom:10px; }
  .divider { border:none; border-top:1px solid #eee; margin:8px 0; }
  .prog-wrap { width:100%; height:5px; background:#e0e0e0; border-radius:3px; margin-bottom:8px; overflow:hidden; display:none; }
  .prog-fill { height:100%; width:0%; background:#1a3a2a; border-radius:3px; transition:width 0.4s; }
  .msg { padding:7px 10px; border-radius:3px; font-size:12px; display:none; margin-top:4px; line-height:1.5; }
  .sec { font-size:11px; font-weight:700; color:#666; text-transform:uppercase; letter-spacing:0.5px; margin:6px 0 4px; }
  .login-box { border:1px solid #e0e0e0; border-radius:4px; padding:10px; margin-bottom:10px; background:#f9f9f9; }
  .login-box .login-title { font-size:12px; font-weight:700; color:#444; margin-bottom:8px; }
  .row2 { display:flex; gap:8px; }
  .row2 > * { flex:1; }
  .token-info { font-size:10px; color:#888; margin-top:-6px; margin-bottom:8px; }
</style>
</head>
<body>

<div class="header">&#11015; Export to KMZ</div>
<div class="body">

  <!-- Status -->
  <div id="mainStatus" class="bar bar-warn">&#9675; Connecting to Enterprise...</div>

  <!-- Login section (shown if token needed) -->
  <div id="loginSection" style="display:none;">
    <div class="login-box">
      <div class="login-title">&#128274; Enterprise Login Required</div>
      <div class="row2">
        <div>
          <label class="lbl">Username</label>
          <input type="text" id="inUser" value="hkhalid" placeholder="Username">
        </div>
        <div>
          <label class="lbl">Password</label>
          <input type="password" id="inPass" placeholder="Password">
        </div>
      </div>
      <button class="btn btn-blue" id="btnLogin" onclick="doLogin()">&#128274; Login to Enterprise</button>
      <div id="loginMsg" class="msg"></div>
    </div>
  </div>

  <!-- Token status -->
  <div id="tokenStatus" style="display:none;" class="bar bar-ok"></div>

  <!-- Layer -->
  <div class="sec">Layer</div>
  <label class="lbl">Feature Layer URL</label>
  <textarea id="layerUrl" rows="2">https://arcgis.balad.com.sa/server/rest/services/Hosted/Final_GDB_BDC_Project_Analysis/FeatureServer/1</textarea>
  <button class="btn btn-blue" id="btnLoad" onclick="loadFields()" disabled>&#8635; Load Fields from Layer</button>

  <!-- Fields -->
  <div id="fieldSection" style="display:none;">
    <div class="sec">Popup Fields</div>
    <div class="field-list">
      <div class="fl-head">
        <button onclick="selectAll()">All</button>
        <button onclick="selectNone()">None</button>
      </div>
      <div id="fieldItems"></div>
    </div>
  </div>

  <!-- Filter -->
  <div class="sec">Active Filter from Map</div>
  <div id="filterStatus" class="bar bar-warn" style="margin-bottom:6px;">&#9675; Not synced yet</div>
  <div class="filter-box" id="filterBox">No filter active (all features)</div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:#555;">
    <input type="checkbox" id="autoSync" checked onchange="toggleAuto(this.checked)">
    <label for="autoSync">Auto-sync every 3 seconds</label>
    <button class="btn btn-blue" style="width:auto;padding:3px 10px;margin:0;font-size:11px;" onclick="readFilter()">&#8635; Now</button>
  </div>

  <!-- Output -->
  <div class="sec">Output</div>
  <label class="lbl">File Name</label>
  <input type="text" id="outName" value="BDC_Assets_Export">
  <div class="note">KML popup title is always: <strong>Assets_Id</strong></div>

  <hr class="divider">

  <button class="btn-green" id="btnExport" onclick="doExport()" disabled>&#11015; Load Fields First</button>
  <div class="prog-wrap" id="progWrap"><div class="prog-fill" id="progFill"></div></div>
  <div class="msg" id="msgBox"></div>

</div>
<script>
var PORTAL  = 'https://arcgis.balad.com.sa/portal';
var SERVER  = 'https://arcgis.balad.com.sa/server';
var SVC_NAME = 'Final_GDB_BDC_Project_Analysis';
var token = '';
var tokenExpiry = 0;
var allFields = [];
var selFields  = [];
var curFilter  = '1=1';
var autoTimer  = null;

// ── UI helpers ────────────────────────────────────────────────────────────────
function bar(id, text, type) {
  var el = document.getElementById(id);
  el.className = 'bar bar-' + type;
  el.innerHTML = text;
  el.style.display = 'block';
}
function prog(pct) { document.getElementById('progFill').style.width = pct + '%'; }
function showProg(v) { document.getElementById('progWrap').style.display = v ? 'block' : 'none'; }
function msg(text, type) { var el = document.getElementById('msgBox'); el.className = 'msg bar-' + type; el.innerHTML = text; el.style.display = 'block'; }
function hideMsg() { document.getElementById('msgBox').style.display = 'none'; }
function setExportBtn(state) {
  var b = document.getElementById('btnExport');
  b.className = 'btn-green';
  if (state === 'idle')    { b.textContent = '\u2B07 Export Filtered Features to KMZ'; b.disabled = false; }
  if (state === 'run')     { b.textContent = '\u23F3 Exporting...'; b.disabled = true; }
  if (state === 'done')    { b.textContent = '\u2713 Export Again'; b.className = 'btn-green done'; b.disabled = false; }
  if (state === 'err')     { b.textContent = '\u21BA Try Again'; b.className = 'btn-green err'; b.disabled = false; }
  if (state === 'nofield') { b.textContent = '\u2B07 Load Fields First'; b.disabled = true; }
}

// ── Token: try parent first, then login form ──────────────────────────────────
async function getTokenFromParent() {
  var wins = [window, window.parent, window.top];
  for (var i = 0; i < wins.length; i++) {
    try {
      var w = wins[i];
      // JSAPI IdentityManager credentials
      if (w.__esri && w.__esri.id) {
        var creds = w.__esri.id.credentials;
        for (var c = 0; c < (creds || []).length; c++) {
          if (creds[c] && creds[c].token) return creds[c].token;
        }
      }
      // jimu token
      if (w.jimuConfig && w.jimuConfig.token) return w.jimuConfig.token;
      // require IdentityManager
      if (w.require) {
        var t = await new Promise(function(res) {
          try {
            w.require(['esri/identity/IdentityManager'], function(IM) {
              try { var c = IM.credentials; res((c && c.length) ? (c[0].token || '') : ''); }
              catch(e) { res(''); }
            });
          } catch(e) { res(''); }
          setTimeout(function(){ res(''); }, 1500);
        });
        if (t) return t;
      }
    } catch(e) {}
  }
  return '';
}

async function doLogin() {
  var user = document.getElementById('inUser').value.trim();
  var pass = document.getElementById('inPass').value.trim();
  if (!user || !pass) { showLoginMsg('Enter username and password.', 'err'); return; }

  document.getElementById('btnLogin').disabled = true;
  document.getElementById('btnLogin').textContent = 'Logging in...';
  showLoginMsg('Contacting Enterprise...', 'info');

  try {
    // Generate token from Portal
    var params = new URLSearchParams({
      username: user, password: pass,
      client: 'requestip', expiration: '120', f: 'json'
    });
    var res = await fetch(PORTAL + '/sharing/rest/generateToken', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString(),
      credentials: 'include'
    });
    var data = await res.json();
    if (data.error || !data.token) {
      // Try server token
      var res2 = await fetch(SERVER + '/tokens/generateToken', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString(),
        credentials: 'include'
      });
      var data2 = await res2.json();
      if (data2.error || !data2.token) throw new Error(data.error ? data.error.message : 'Login failed');
      data = data2;
    }

    token = data.token;
    tokenExpiry = data.expires || (Date.now() + 7200000);
    onTokenReady();

  } catch(e) {
    showLoginMsg('Login failed: ' + e.message, 'err');
    document.getElementById('btnLogin').disabled = false;
    document.getElementById('btnLogin').textContent = '\uD83D\uDD12 Login to Enterprise';
  }
}

function showLoginMsg(text, type) {
  var el = document.getElementById('loginMsg');
  el.className = 'msg bar-' + type;
  el.innerHTML = text;
  el.style.display = 'block';
}

function onTokenReady() {
  document.getElementById('loginSection').style.display = 'none';
  var exp = new Date(tokenExpiry);
  bar('tokenStatus', '&#128274; Token active — expires ' + exp.getHours() + ':' + String(exp.getMinutes()).padStart(2,'0'), 'ok');
  document.getElementById('tokenStatus').style.display = 'block';
  bar('mainStatus', '&#9679; Connected to Enterprise', 'ok');
  document.getElementById('btnLoad').disabled = false;
  // Auto-load fields
  loadFields();
  // Start filter sync
  toggleAuto(true);
}

// ── Init: try to get token automatically ─────────────────────────────────────
window.addEventListener('load', async function() {
  bar('mainStatus', '&#9675; Detecting login...', 'warn');

  // First try to get token from parent EXB session
  var t = await getTokenFromParent();
  if (t) {
    token = t;
    tokenExpiry = Date.now() + 7200000;
    onTokenReady();
    return;
  }

  // Try cookie-based (same domain)
  try {
    var res = await fetch(PORTAL + '/sharing/rest/portals/self?f=json', { credentials: 'include' });
    var data = await res.json();
    if (data.id && !data.error) {
      // We're logged in via cookie — get token
      var tRes = await fetch(PORTAL + '/sharing/rest/generateToken', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'f=json&request=gettoken&expiration=120&referer=' + encodeURIComponent(location.origin)
      });
      var tData = await tRes.json();
      if (tData.token) {
        token = tData.token;
        tokenExpiry = tData.expires || (Date.now() + 7200000);
        onTokenReady();
        return;
      }
    }
  } catch(e) {}

  // Show login form
  bar('mainStatus', '&#9888; Login required', 'warn');
  document.getElementById('loginSection').style.display = 'block';
});

// ── Read filter from EXB map ──────────────────────────────────────────────────
function readFilter() {
  var found = false;
  var newFilter = '1=1';
  var wins = [];
  try { wins.push(window.parent); } catch(e) {}
  try { if (window.top !== window.parent) wins.push(window.top); } catch(e) {}

  for (var wi = 0; wi < wins.length; wi++) {
    try {
      var w = wins[wi];
      if (w.__jimuMapViews) {
        Object.keys(w.__jimuMapViews).forEach(function(k) {
          if (found) return;
          try {
            var view = w.__jimuMapViews[k];
            if (!view || !view.view || !view.view.map) return;
            view.view.map.layers.forEach(function(layer) {
              if (found) return;
              var lUrl = (layer.url || '').toLowerCase();
              if (lUrl.includes(SVC_NAME.toLowerCase()) || lUrl.includes('bdc_assets') || (layer.title && layer.title.toLowerCase().includes('bdc'))) {
                newFilter = layer.definitionExpression || '1=1';
                found = true;
              }
            });
          } catch(e) {}
        });
      }
      // Also try direct map view
      if (!found && w.document) {
        var els = w.document.querySelectorAll('[class*="esri-view"], arcgis-map');
        els.forEach(function(el) {
          if (found) return;
          try {
            var v = el.__view__ || el.view;
            if (v && v.map) {
              v.map.layers.forEach(function(l) {
                if (found) return;
                if ((l.url || '').toLowerCase().includes(SVC_NAME.toLowerCase())) {
                  newFilter = l.definitionExpression || '1=1';
                  found = true;
                }
              });
            }
          } catch(e) {}
        });
      }
    } catch(e) {}
  }

  curFilter = newFilter;
  var fbox = document.getElementById('filterBox');
  var fstat = document.getElementById('filterStatus');
  if (found && newFilter !== '1=1') {
    fbox.textContent = newFilter;
    fbox.style.color = '#1a3a2a';
    bar('filterStatus', '&#9679; Filter detected from map!', 'ok');
  } else if (found) {
    fbox.textContent = 'No filter active — all features will export';
    fbox.style.color = '#888';
    bar('filterStatus', '&#9675; Map connected — no filter applied', 'warn');
  } else {
    fbox.textContent = newFilter === '1=1' ? 'No filter active (all features)' : newFilter;
    bar('filterStatus', '&#9888; Could not auto-detect — using: all features', 'warn');
  }
}

function toggleAuto(on) {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (on) autoTimer = setInterval(readFilter, 3000);
}

// ── Load fields ───────────────────────────────────────────────────────────────
async function loadFields() {
  var url = document.getElementById('layerUrl').value.trim();
  if (!url || !token) return;
  document.getElementById('btnLoad').disabled = true;
  document.getElementById('btnLoad').textContent = 'Loading...';
  hideMsg();
  try {
    var res = await fetch(url + '?f=json&token=' + encodeURIComponent(token), { credentials: 'include' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    if (data.error) throw new Error(data.error.message);
    var skip = ['Shape','Shape_Length','Shape_Area','GlobalID','CreationDate','EditDate','Creator','Editor'];
    allFields = (data.fields || []).map(function(f){ return f.name; }).filter(function(n){ return !skip.includes(n) && n !== 'OBJECTID'; });
    selFields = allFields.slice();
    renderFields();
    document.getElementById('fieldSection').style.display = 'block';
    setExportBtn('idle');
    msg('\u2713 ' + allFields.length + ' fields loaded. Ready to export.', 'ok');
    setTimeout(hideMsg, 2500);
    readFilter();
  } catch(e) {
    msg('Could not load fields: ' + e.message, 'err');
    // If token expired, show login again
    if (e.message.toLowerCase().includes('token') || e.message.toLowerCase().includes('invalid')) {
      token = '';
      document.getElementById('loginSection').style.display = 'block';
      bar('mainStatus', '&#9888; Session expired — please login again', 'warn');
    }
  }
  document.getElementById('btnLoad').disabled = false;
  document.getElementById('btnLoad').textContent = '\u21BB Load Fields from Layer';
}

function renderFields() {
  var c = document.getElementById('fieldItems');
  c.innerHTML = '';
  allFields.forEach(function(f) {
    var on = selFields.includes(f);
    var d = document.createElement('div');
    d.className = 'fi' + (on ? ' on' : '');
    d.innerHTML = '<input type="checkbox"' + (on ? ' checked' : '') + '><span>' + f + '</span>';
    d.querySelector('input').addEventListener('change', function(e) {
      if (e.target.checked) { if (!selFields.includes(f)) selFields.push(f); d.classList.add('on'); }
      else { selFields = selFields.filter(function(x){ return x !== f; }); d.classList.remove('on'); }
    });
    c.appendChild(d);
  });
}
function selectAll()  { selFields = allFields.slice(); renderFields(); }
function selectNone() { selFields = []; renderFields(); }

// ── Build KML ─────────────────────────────────────────────────────────────────
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function buildKml(feats, fields, name) {
  var pms = feats.map(function(f) {
    var a = f.attributes || {}, g = f.geometry;
    var title = esc(a['Assets_Id'] || a['ASSETS_ID'] || a['Asset_Id'] || 'Asset');
    var rows = fields.map(function(k) {
      var v = a[k]; if (v == null || v === '') return '';
      return '<tr><td style="padding:3px 6px;border:1px solid #ccc;font-weight:bold">' + esc(k) + '</td><td style="padding:3px 6px;border:1px solid #ccc">' + esc(v) + '</td></tr>';
    }).filter(Boolean).join('');
    var desc = '<![CDATA[<table style="border-collapse:collapse;font-size:12px">' + rows + '</table>]]>';
    var geo = '';
    if (g) {
      if (g.rings) { var c = g.rings[0].map(function(p){return p[0]+','+p[1]+',0';}).join(' '); geo = '<Polygon><outerBoundaryIs><LinearRing><tessellate>1</tessellate><coordinates>'+c+'</coordinates></LinearRing></outerBoundaryIs></Polygon>'; }
      else if (g.paths) { var c = g.paths[0].map(function(p){return p[0]+','+p[1]+',0';}).join(' '); geo = '<LineString><tessellate>1</tessellate><coordinates>'+c+'</coordinates></LineString>'; }
      else if (g.x != null) { geo = '<Point><coordinates>'+g.x+','+g.y+',0</coordinates></Point>'; }
    }
    return '<Placemark><name>'+title+'</name><description>'+desc+'</description>'+geo+'</Placemark>';
  });
  return '<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+esc(name)+'</name><Style id="s"><PolyStyle><color>7f1a3a2a</color><outline>1</outline></PolyStyle><LineStyle><color>ff1a3a2a</color><width>2</width></LineStyle><LabelStyle><scale>1.2</scale></LabelStyle></Style>'+pms.join('')+'</Document></kml>';
}

// ── Query ─────────────────────────────────────────────────────────────────────
async function queryAll(url, where, fields) {
  var all = [], offset = 0, pageSize = 1000, more = true;
  while (more) {
    var p = new URLSearchParams({ where: where||'1=1', outFields: fields.join(','), returnGeometry:'true', outSR:'4326', f:'json', resultOffset:String(offset), resultRecordCount:String(pageSize), token: token });
    var r = await fetch(url+'/query', { method:'POST', credentials:'include', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:p.toString() });
    if (!r.ok) throw new Error('HTTP '+r.status);
    var d = await r.json();
    if (d.error) throw new Error(d.error.message);
    var fs = d.features||[];
    all = all.concat(fs);
    offset += fs.length;
    more = fs.length === pageSize && d.exceededTransferLimit === true;
  }
  return all;
}

// ── Export ────────────────────────────────────────────────────────────────────
async function doExport() {
  if (!selFields.length) { msg('Select at least one field.', 'err'); return; }
  setExportBtn('run'); showProg(true); prog(10);
  readFilter();
  try {
    var url  = document.getElementById('layerUrl').value.trim();
    var name = document.getElementById('outName').value.trim() || 'BDC_Export';
    msg('Querying ' + (curFilter==='1=1'?'all':'filtered') + ' features...', 'info');
    prog(25);
    var qFields = Array.from(new Set(['OBJECTID','Assets_Id','Asset_Id'].concat(selFields)));
    var feats = await queryAll(url, curFilter, qFields);
    if (!feats.length) { setExportBtn('err'); showProg(false); msg('No features returned. Try clearing some filters.', 'err'); return; }
    prog(60); msg('Building KML for '+feats.length+' features...', 'info');
    var kml = buildKml(feats, selFields, name);
    prog(80); msg('Packaging KMZ...', 'info');
    var zip = new JSZip();
    zip.file('doc.kml', kml);
    var blob = await zip.generateAsync({type:'blob', compression:'DEFLATE'});
    prog(100);
    var burl = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href=burl; a.download=name+'.kmz';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(burl);
    setExportBtn('done');
    msg('\u2713 '+feats.length+' features exported as <strong>'+name+'.kmz</strong>', 'ok');
  } catch(e) {
    setExportBtn('err'); showProg(false);
    msg('Export failed: '+e.message, 'err');
  }
}

window.addEventListener('message', function(e) {
  try { if (e.data && e.data.type==='FILTER_UPDATE') { curFilter = e.data.filter||'1=1'; readFilter(); } } catch(x) {}
});
</script>
</body>
</html>
